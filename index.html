<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAF7" />
    <meta name="description" content="Clover Desk personal productivity dashboard" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/clover-v2-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/clover-v2-192.png" />
    <link rel="shortcut icon" href="/favicon.ico?v=clover-v2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/clover-v2-180.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=clover-v2" />
    <title>Clover Desk</title>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        }).catch(function () {});
      }
      if ("caches" in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
          });
        }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
